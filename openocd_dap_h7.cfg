# DAPLink / CMSIS-DAP 调试器配置 —— DM_4310 (STM32H723VGTx)
#
# 原来误用了 D:\RM source\电控\basic_framework_LIF-mai\openocd_dap.cfg,
# 那份配置是给 basic_framework (STM32F407IGHx) 用的, 目标是 stm32f4x.cfg,
# 用错会导致 OpenOCD 报 "Cannot identify target as a STM32 family", 无法烧录.

source [find interface/cmsis-dap.cfg]

# 选择接口为 SWD
transport select swd

# 选择目标芯片: STM32H723VGTx -> stm32h7x.cfg
source [find target/stm32h7x.cfg]

# 注意: adapter speed 必须写在 target cfg 之后,
# 因为 stm32h7x.cfg 内部会把速度设成 4000, 写在前面会被覆盖.
adapter speed 4000
